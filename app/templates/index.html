<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorae - Real-Time Google Meet AI Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .status-pulse {
      animation: pulse-subtle 1.8s infinite;
    }
  </style>
</head>

<body
  class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 selection:bg-indigo-500 selection:text-white">

  <div class="max-w-xl w-full bg-slate-800/90 border border-slate-700/80 rounded-2xl shadow-2xl p-8 backdrop-blur-md">

    <!-- Header -->
    <div class="flex items-center space-x-3 mb-6">
      <div
        class="w-11 h-11 rounded-xl bg-indigo-500/20 border border-indigo-400/40 flex items-center justify-center text-indigo-400 text-xl font-bold">
        🎙️
      </div>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Memorae AI Agent</h1>
        <p class="text-xs text-slate-400">Google Meet Real-Time Conversational Participant</p>
      </div>
    </div>

    <!-- Alert / Toast Banner -->
    <div id="alertBanner"
      class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium border flex items-center justify-between">
      <span id="alertText"></span>
      <button onclick="hideAlert()" class="ml-2 text-slate-400 hover:text-white">&times;</button>
    </div>

    <!-- Form Section -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Google Meet URL <span class="text-rose-400">*</span>
        </label>
        <input id="meetUrl" type="url" placeholder="https://meet.google.com/xxx-yyyy-zzz"
          value="https://meet.google.com/caa-aadv-tyx"
          class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-mono" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Agent Display Name
          </label>
          <input id="botName" type="text" value="memo"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-semibold text-indigo-300" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
            Voice Pipeline Engine
          </label>
          <select id="pipelineProvider"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm font-semibold text-emerald-400">
            <option value="groq" selected>⚡ Groq Stack (Whisper + Qwen + Orpheus)</option>
            <option value="speaking_bots">🤖 Hosted Speaking Bot (GPT-4o-mini + Cartesia)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
          Spoken Greeting
        </label>
        <input id="entryMessage" type="text" value="Hey everyone, memo here. Glad to join."
          class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm" />
      </div>

      <!-- Action Buttons -->
      <div class="flex space-x-3 pt-2">
        <button id="joinBtn" onclick="handleJoin()"
          class="flex-1 py-3 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] font-semibold text-white transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 cursor-pointer">
          <span id="joinBtnText">Send Agent to Call</span>
        </button>
        <button id="leaveBtn" onclick="handleLeave()" disabled
          class="py-3 px-5 rounded-xl bg-rose-600/20 border border-rose-500/30 text-rose-300 font-semibold hover:bg-rose-600 hover:text-white disabled:opacity-30 disabled:pointer-events-none transition cursor-pointer">
          <span id="leaveBtnText">Leave Call</span>
        </button>
      </div>
    </div>

    <!-- Status Card -->
    <div id="statusCard" class="mt-6 p-4 rounded-xl bg-slate-900/90 border border-slate-700/80 hidden transition-all">
      <div class="flex items-center justify-between">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Active Session</span>
        <span id="statusBadge"
          class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 status-pulse">
          JOINING
        </span>
      </div>

      <div class="mt-3 text-xs space-y-1.5 text-slate-400 font-mono">
        <div class="flex justify-between">
          <span class="text-slate-500">Bot ID:</span>
          <span id="botIdDisplay" class="text-slate-200 truncate max-w-[280px]"></span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500">Meeting:</span>
          <span id="meetingDisplay" class="text-slate-300 truncate max-w-[280px]"></span>
        </div>
      </div>

      <div id="statusNotice"
        class="mt-3 text-xs text-indigo-300/90 italic pt-2 border-t border-slate-800 flex items-center space-x-1.5">
        <span>👉 Please click <strong>Admit</strong> in Google Meet when the agent requests to enter!</span>
      </div>
    </div>

  </div>

  <footer class="mt-6 text-xs text-slate-500 flex items-center space-x-3">
    <span>FastAPI Backend</span>
    <span>&bull;</span>
    <span>Meeting BaaS Bridge</span>
    <span>&bull;</span>
    <span>LiteLLM Brain</span>
  </footer>

  <script>
    let activeBotId = null;
    let pollTimer = null;

    function showAlert(msg, isError = false) {
      const banner = document.getElementById('alertBanner');
      const text = document.getElementById('alertText');
      text.innerText = msg;
      banner.className = isError
        ? "mb-4 p-3.5 rounded-xl text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-300 flex items-center justify-between"
        : "mb-4 p-3.5 rounded-xl text-xs font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-300 flex items-center justify-between";
      banner.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alertBanner').classList.add('hidden');
    }

    async function handleJoin() {
      hideAlert();
      const meetUrl = document.getElementById('meetUrl').value.trim();
      const botName = document.getElementById('botName').value.trim();
      const entryMessage = document.getElementById('entryMessage').value.trim();
      const pipelineProvider = document.getElementById('pipelineProvider').value;
      const joinBtn = document.getElementById('joinBtn');
      const joinBtnText = document.getElementById('joinBtnText');
      const leaveBtn = document.getElementById('leaveBtn');

      if (!meetUrl) {
        showAlert("Please enter a Google Meet URL", true);
        return;
      }

      joinBtn.disabled = true;
      joinBtnText.innerText = "Dispatching Agent...";

      try {
        const resp = await fetch('/api/v1/bots/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            meeting_url: meetUrl,
            bot_name: botName || undefined,
            entry_message: entryMessage || undefined,
            pipeline_provider: pipelineProvider
          })
        });

        const data = await resp.json();
        if (!resp.ok) {
          throw new Error(data.detail || "Failed to dispatch bot");
        }

        activeBotId = data.bot_id;
        showStatusCard(activeBotId, meetUrl, data.status);
        leaveBtn.disabled = false;
        joinBtnText.innerText = "Agent in Session";
        showAlert(`Agent '${botName || "memo"}' dispatched! Check your Google Meet tab to Admit.`);

        startPolling(activeBotId);

      } catch (err) {
        showAlert(err.message, true);
        joinBtn.disabled = false;
        joinBtnText.innerText = "Send Agent to Call";
      }
    }

    async function handleLeave() {
      if (!activeBotId) return;
      hideAlert();
      const leaveBtn = document.getElementById('leaveBtn');
      const leaveBtnText = document.getElementById('leaveBtnText');
      leaveBtn.disabled = true;
      leaveBtnText.innerText = "Disconnecting...";

      try {
        const resp = await fetch(`/api/v1/bots/${activeBotId}`, { method: 'DELETE' });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.detail || "Failed to disconnect bot");
        }

        showAlert(data.message || "Agent disconnected from meeting.");
        updateBadge("ended");
        clearInterval(pollTimer);

        setTimeout(() => {
          resetUI();
        }, 1500);

      } catch (err) {
        showAlert(err.message, true);
        leaveBtn.disabled = false;
        leaveBtnText.innerText = "Leave Call";
      }
    }

    function showStatusCard(botId, meetUrl, status) {
      document.getElementById('statusCard').classList.remove('hidden');
      document.getElementById('botIdDisplay').innerText = botId;
      document.getElementById('meetingDisplay').innerText = meetUrl;
      updateBadge(status);
    }

    function updateBadge(status) {
      const badge = document.getElementById('statusBadge');
      const st = (status || "").toLowerCase();
      badge.innerText = st.replace(/_/g, ' ').toUpperCase();

      if (st === 'in_call') {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
        document.getElementById('statusNotice').classList.add('hidden');
      } else if (['ended', 'failed'].includes(st)) {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30";
      } else {
        badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30 status-pulse";
      }
    }

    function startPolling(botId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const resp = await fetch(`/api/v1/bots/${botId}`);
          if (resp.ok) {
            const data = await resp.json();
            if (data.status) {
              updateBadge(data.status);
              const st = data.status.toLowerCase();
              const extra = data.extra_details || {};
              if (st === 'waiting_for_admission') {
                showAlert("Agent is in the waiting room - click 'Admit' in Google Meet.");
              }
              if (['ended', 'failed'].includes(st)) {
                clearInterval(pollTimer);
                if (st === 'failed') {
                  const why = extra.error || extra.provider_status || 'unknown reason';
                  showAlert(`Agent failed to join: ${why}`, true);
                }
                resetUI();
              }
            }
          }
        } catch (_) { }
      }, 4000);
    }

    function resetUI() {
      const joinBtn = document.getElementById('joinBtn');
      const joinBtnText = document.getElementById('joinBtnText');
      const leaveBtn = document.getElementById('leaveBtn');
      const leaveBtnText = document.getElementById('leaveBtnText');

      activeBotId = null;
      joinBtn.disabled = false;
      joinBtnText.innerText = "Send Agent to Call";
      leaveBtn.disabled = true;
      leaveBtnText.innerText = "Leave Call";
    }
  </script>
</body>

</html>
